---
- name: 透過遠端 SSH 直接安裝 Node.js 與 AI 工具
  hosts: all
  gather_facts: no

  vars:
    node_version: "20"
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: 顯示主機資訊
      ansible.builtin.raw: |
        echo '主機名稱: ' $(hostname)
        echo '主要 IP: ' $(hostname -I | awk '{print $1}')
      register: host_info

    - name: 更新套件庫並安裝必要套件
      ansible.builtin.raw: |
        echo 'p@ssw0rd2004' | sudo -S apt-get update
        echo 'p@ssw0rd2004' | sudo -S apt-get install -y curl ca-certificates gnupg
      register: apt_install

    - name: 下載並安裝 Node.js repository
      ansible.builtin.raw: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x -o /tmp/nodesource_setup.sh
        echo 'p@ssw0rd2004' | sudo -S bash /tmp/nodesource_setup.sh
      register: nodejs_repo

    - name: 安裝 Node.js
      ansible.builtin.raw: |
        echo 'p@ssw0rd2004' | sudo -S apt-get update
        echo 'p@ssw0rd2004' | sudo -S apt-get install -y nodejs
      register: nodejs_install

    - name: 全域安裝 npm 套件
      ansible.builtin.raw: |
        echo 'p@ssw0rd2004' | sudo -S npm install -g codex-cli
        echo 'p@ssw0rd2004' | sudo -S npm install -g @anthropic-ai/claude-code
      register: npm_install

    - name: 驗證安裝結果
      ansible.builtin.raw: |
        echo 'Node 版本:' $(node -v)
        echo 'npm 版本:' $(npm -v)
        echo 'codex-cli:' $(which codex-cli || echo 'not found')
        echo 'claude:' $(which claude || echo 'not found')
        claude -v 2>/dev/null || echo 'Claude Code: not installed or needs config'
      register: verify_output

    - name: 顯示主機資訊
      debug:
        var: host_info.stdout_lines

    - name: 顯示驗證結果
      debug:
        var: verify_output.stdout_lines
