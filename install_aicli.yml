- name: 透過遠端 SSH 直接安裝 Node.js 與 AI 工具
  hosts: all
  gather_facts: yes  # 啟用此項可直接獲取主機資訊，不需用 echo 抓取
  become: yes        # 告訴 Ansible 執行需要 sudo 權限的任務

  vars:
    node_version: "20"
    # 移除寫死的密碼與 python 路徑變數，交給 Semaphore 管理

  tasks:
    - name: 顯示主機資訊
      ansible.builtin.debug:
        msg: 
          - "主機名稱: {{ ansible_hostname }}"
          - "主要 IP: {{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}"

    - name: 更新套件庫並安裝必要套件
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
        update_cache: yes
        state: present

    - name: 下載 Node.js 安裝腳本
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: '0755'

    - name: 執行 Node.js 來源設定
      ansible.builtin.command: bash /tmp/nodesource_setup.sh

    - name: 安裝 Node.js
      ansible.builtin.apt:
        name: nodejs
        update_cache: yes
        state: present

    - name: 安裝 Hermes Agent
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
      become: no # 如果此工具不需 root 權限，請關閉 become
      ignore_errors: yes

    - name: 安裝 Codex CLI
      ansible.builtin.shell: |
        curl -fsSL https://chatgpt.com/codex/install.sh | sh
      become: no
      ignore_errors: yes

    - name: 全域安裝 Claude Code
      community.general.npm:
        name: "@anthropic-ai/claude-code"
        global: yes
        state: present

    - name: 驗證安裝結果
      ansible.builtin.shell: |
        echo 'Node 版本:' $(node -v 2>&1)
        echo 'npm 版本:' $(npm -v 2>&1)
        echo 'hermes:' $(which hermes || echo 'not found')
        echo 'codex-cli:' $(which codex-cli || echo 'not found')
        echo 'claude:' $(which claude || echo 'not found')
      register: verify_output
      changed_when: false
      ignore_errors: yes

    - name: 顯示驗證結果
      ansible.builtin.debug:
        var: verify_output.stdout_lines
