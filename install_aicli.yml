---
- name: 透過遠端 SSH 直接安裝 Node.js 與 AI 工具
  hosts: all
  gather_facts: no     # 徹底關閉，防止觸發 Python 3.9+ 檢查

  vars:
    node_version: "20"  # 可自訂 Node.js 版本

  tasks:
    # ----------------------------------------------------
    # 第一步：直接在 Semaphore 本地端對目標主機發送純 SSH 指令
    # ----------------------------------------------------
    - name: 遠端一鍵設定環境並安裝所有工具
      delegate_to: localhost
      ansible.builtin.shell: |
        ssh -o StrictHostKeyChecking=no {{ ansible_user | default('root') }}@{{ inventory_hostname }} "
          echo '=== 開始獲取主機資訊 ===' && \
          echo '主機名稱: ' \$(hostname) && \
          echo '主要 IP: ' \$(hostname -I | awk '{print \$1}') && \
          \
          echo '=== 更新套件庫並安裝 Node.js ===' && \
          sudo apt-get update && sudo apt-get install -y curl ca-certificates gnupg && \
          curl -fsSL https://nodesource.com_{{ node_version }}.x | sudo bash - && \
          sudo apt-get install -y nodejs && \
          \
          echo '=== 安裝 Hermes Agent ===' && \
          curl -fsSL https://githubusercontent.com | sudo bash && \
          \
          echo '=== 全域安裝 npm 套件 ===' && \
          sudo npm install -g codex-cli && \
          sudo npm install -g @anthropic-ai/claude-code && \
          \
          echo '=== 驗證安裝結果 ===' && \
          echo 'npm 版本:' \$(npm -v) && \
          echo 'Hermes 路徑:' \$(which hermes) && \
          echo 'Claude Code 版本:' \$(claude -v)
        "
      register: ssh_output
      changed_when: true

    # ----------------------------------------------------
    # 第二步：漂亮的印出遠端主機執行的所有日誌紀錄
    # ----------------------------------------------------
    - name: 顯示遠端安裝實時日誌
      debug:
        var: ssh_output.stdout_lines
