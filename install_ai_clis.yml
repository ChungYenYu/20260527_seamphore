- name: 安裝六大 AI CLI (hermes / codex / claude-code / opencode / gemini / copilot)
  hosts: all
  gather_facts: no

  vars:
    node_version: "20"
    target_user: "cary_yu"
    npm_globals:
      - "@openai/codex"
      - "@anthropic-ai/claude-code"
      - "opencode-ai"
      - "@google/gemini-cli"
      - "@github/copilot"

  tasks:
    - name: 主機資訊
      raw: echo "$(hostname) / $(hostname -I | awk '{print $1}') / $(. /etc/os-release && echo $PRETTY_NAME)"
      register: hostinfo
      changed_when: false

    - debug: msg="{{ hostinfo.stdout | trim }}"

    - name: 安裝系統相依套件 (curl/ca-certs/gnupg/git/build-essential)
      raw: echo "{{ ansible_ssh_pass }}" | sudo -S DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates gnupg git build-essential

    - name: 加入 NodeSource {{ node_version }}.x 來源並安裝 Node.js
      raw: |
        if command -v node >/dev/null && node -v | grep -q '^v{{ node_version }}\.'; then
          echo "Node already installed: $(node -v)"
        else
          curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x -o /tmp/nodesource_setup.sh
          echo "{{ ansible_ssh_pass }}" | sudo -S bash /tmp/nodesource_setup.sh
          echo "{{ ansible_ssh_pass }}" | sudo -S DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
        fi
      register: node_out

    - name: 設定 {{ target_user }} 的 npm global prefix → ~/.npm-global (避免 EACCES)
      raw: |
        echo "{{ ansible_ssh_pass }}" | sudo -S -u {{ target_user }} -H bash -lc '
          mkdir -p $HOME/.npm-global
          npm config set prefix $HOME/.npm-global
          grep -q "npm-global/bin" $HOME/.bashrc 2>/dev/null || echo "export PATH=\$HOME/.npm-global/bin:\$PATH" >> $HOME/.bashrc
          echo "prefix=$(npm config get prefix)"
        '
      register: prefix_out
      changed_when: false

    - name: npm install -g {{ item }}
      raw: |
        echo "{{ ansible_ssh_pass }}" | sudo -S -u {{ target_user }} -H bash -lc '
          export PATH=$HOME/.npm-global/bin:$PATH
          npm install -g --silent {{ item }} 2>&1 | tail -10
        '
      loop: "{{ npm_globals }}"
      register: npm_out
      ignore_errors: yes

    - name: 顯示 npm 安裝結果
      debug:
        msg: "{{ item.item }} → rc={{ item.rc }}"
      loop: "{{ npm_out.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 安裝 Hermes Agent (per-user)
      raw: |
        echo "{{ ansible_ssh_pass }}" | sudo -S -u {{ target_user }} -H bash -lc '
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash 2>&1 | tail -15
        '
      register: hermes_out
      ignore_errors: yes

    - name: 驗證各 CLI 版本
      raw: |
        echo "{{ ansible_ssh_pass }}" | sudo -S -u {{ target_user }} -H bash -lc '
          export PATH=$HOME/.npm-global/bin:$HOME/.local/bin:$PATH
          printf "%-10s %s\n" node     "$(node -v 2>&1 || echo MISSING)"
          printf "%-10s %s\n" npm      "$(npm -v 2>&1 || echo MISSING)"
          printf "%-10s %s\n" codex    "$(codex --version 2>&1 | head -1 || echo MISSING)"
          printf "%-10s %s\n" claude   "$(claude --version 2>&1 | head -1 || echo MISSING)"
          printf "%-10s %s\n" opencode "$(opencode --version 2>&1 | head -1 || echo MISSING)"
          printf "%-10s %s\n" gemini   "$(gemini --version 2>&1 | head -1 || echo MISSING)"
          printf "%-10s %s\n" copilot  "$(copilot --version 2>&1 | head -1 || echo MISSING)"
          printf "%-10s %s\n" hermes   "$(hermes --version 2>&1 | head -1 || echo MISSING)"
        '
      register: verify
      changed_when: false

    - debug: var=verify.stdout_lines
