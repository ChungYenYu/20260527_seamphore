- name: 在受控主機上安裝 Node.js 與 npm (最簡化版)
  hosts: all
  gather_facts: no     # 保持關閉，不依賴目標主機的 Python Facts

  tasks:
    # ----------------------------------------------------
    # 第一步：獲取主機資訊 (不需要 root 權限)
    # ----------------------------------------------------
    - name: 手動獲取主機與 IP 資訊
      raw: echo "$(hostname),$(hostname -I | awk '{print $1}')"
      register: host_info
      ignore_errors: yes

    - name: 顯示受控主機資訊
      debug:
        msg: "當前主機 (名稱, IP): {{ host_info.stdout | trim }}"

    # ----------------------------------------------------
    # 第二步：安裝步驟 (明確加上 become: yes 配合 Semaphore)
    # ----------------------------------------------------
    - name: 更新系統套件清單
      become: yes
      raw: DEBIAN_FRONTEND=noninteractive apt update -y

    - name: 直接安裝 npm
      become: yes
      raw: DEBIAN_FRONTEND=noninteractive apt install -y npm

    # ----------------------------------------------------
    # 第三步：驗證安裝結果 (不需要 root 權限)
    # ----------------------------------------------------
    - name: 檢查 Node.js 與 npm 版本
      raw: echo "Node:$(node -v 2>&1) / npm:$(npm -v 2>&1)"
      register: version_check
      ignore_errors: yes

    - name: 輸出安裝結果
      debug:
        msg: "版本驗證結果: {{ version_check.stdout | trim }}"
